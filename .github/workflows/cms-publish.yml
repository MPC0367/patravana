# Publishes the Patravana Website Content sheet (Phase 3, 4 November 2026; states made truthful in Phase 4, 5 November).
# The Sheet publisher (Google Apps Script) writes each validated snapshot to inbox/snapshot.json on the cms-inbox branch.
# This workflow checks it, builds the English and Thai pages from it, commits the release to main, asks GitHub Pages to
# deploy it and writes the outcome to inbox/result.json for the Sheet to read. A second job then watches the live site
# and only it may say "live-verified": the manifest, the English page and the Thai page must all carry this revision and
# this build. It holds no lock, so the next edit from the Sheet builds at once instead of waiting for GitHub Pages.
# States written to result.json: rejected, duplicate, superseded (from the build), failed, deploying (committed, waiting
# for Pages), live-verified, timed-out (not seen live in time: neither a success nor proof that it failed).
# Written by export-pages.mjs from the studio's source (deploy/.github/workflows/cms-publish.yml): change it there.
name: Publish content from the Sheet

# Started by the Sheet publisher (workflow_dispatch on main), so it always runs this file as it is on main.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  publish:
    # one build at a time; a newer snapshot waiting replaces an older one waiting (the newest always wins)
    concurrency:
      group: cms-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      generation: ${{ steps.build.outputs.generation }}
    env:
      SITE: https://www.patravana.com/
    steps:
      - name: Check out the site (pages, scripts and content only, not the photographs and films)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            content
            cms
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read the newest snapshot from the Sheet
        run: |
          git fetch --depth 1 origin cms-inbox
          git show origin/cms-inbox:inbox/snapshot.json > "$RUNNER_TEMP/inbox.json"
          echo "RECEIVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Check it and build the pages
        id: build
        run: node cms/build.mjs "$RUNNER_TEMP/inbox.json" "$RUNNER_TEMP/result.json"

      # If main moved on meanwhile (a newer site version), the release is built again on top of it from the same
      # snapshot, never rebased: generated pages are not merged over newer source. Three refusals in a row fail the job.
      - name: Commit the release to the site
        id: commit
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name "Patravana content publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gen="${{ steps.build.outputs.generation }}"; done=no
          for i in 1 2 3; do
            git add -A content index.html th.html i18n.js i18n-en.js facts.js build.json
            git commit -q -m "Content revision $gen from the Sheet"
            if git push -q origin HEAD:main; then done=yes; break; fi
            echo "main moved on (attempt $i): building revision $gen again on the newest site"
            git fetch -q --depth 1 origin main && git reset -q --hard origin/main
            node cms/build.mjs "$RUNNER_TEMP/inbox.json" "$RUNNER_TEMP/result.json" > /dev/null || true
            st=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).status)" "$RUNNER_TEMP/result.json")
            if [ "$st" != "built" ]; then echo "after rebuilding, the snapshot is $st: nothing to commit"; done=$st; break; fi
          done
          if [ "$done" = "yes" ]; then
            echo "committed=true" >> "$GITHUB_OUTPUT"; echo "COMMITTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          elif [ "$done" = "no" ]; then
            echo "::error::revision $gen could not be pushed after 3 attempts; the live site keeps its current version"; exit 1
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask GitHub Pages to deploy it
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "Pages build request not accepted (a push build may already be running)"

      - name: Report back to the Sheet
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
        run: |
          f="$RUNNER_TEMP/result.json"; [ -f "$f" ] || echo '{"status":"failed","problems":["the build did not run"]}' > "$f"
          node -e "
            const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));
            r.run=process.env.GITHUB_RUN_ID; r.outcome=process.env.OUTCOME;
            r.timings={ receivedAt:process.env.RECEIVED_AT||null, committedAt:process.env.COMMITTED_AT||null };
            if (process.env.OUTCOME!=='success') { r.status='failed'; (r.problems=r.problems||[]).push('the publication job stopped before the release reached the site; the live site keeps its current version'); }
            else if (process.env.COMMITTED==='true') r.status='deploying';
            fs.writeFileSync(process.argv[1], JSON.stringify(r,null,1));" "$f"
          sha=$(gh api "repos/${{ github.repository }}/contents/inbox/result.json?ref=cms-inbox" --jq .sha 2>/dev/null || echo "")
          args=(-X PUT "repos/${{ github.repository }}/contents/inbox/result.json" -f message="Publication result" -f branch=cms-inbox -f content="$(base64 -w0 "$f")")
          [ -n "$sha" ] && args+=(-f sha="$sha")
          gh api "${args[@]}" --silent
          cat "$f" >> "$GITHUB_STEP_SUMMARY"

  # Watches the live site after a commit; no lock, so it never delays the next publication. Only this job says
  # live-verified, after reading the manifest, the English page and the Thai page back from the site.
  confirm:
    needs: publish
    if: needs.publish.outputs.committed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      SITE: https://www.patravana.com/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            cms
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read the revision back from the live site (manifest, English page, Thai page)
        id: watch
        run: |
          want=${{ needs.publish.outputs.generation }}; res='{}'
          for i in $(seq 1 120); do
            res=$(node cms/readback.mjs "$SITE" "$want")
            if echo "$res" | grep -q '"ok":true'; then echo "live: $res"; echo "state=live-verified" >> "$GITHUB_OUTPUT"; echo "readback=$res" >> "$GITHUB_OUTPUT"; exit 0; fi
            # a newer revision from the Sheet is live everywhere: it carries this edit, and its own run reports to the Sheet
            if echo "$res" | grep -q '"superseded":true'; then echo "replaced by a newer revision that is live: $res"; echo "state=superseded" >> "$GITHUB_OUTPUT"; echo "readback=$res" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 5
          done
          echo "last read: $res"
          echo "state=timed-out" >> "$GITHUB_OUTPUT"; echo "readback=$res" >> "$GITHUB_OUTPUT"
      - name: Report the live state to the Sheet
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.watch.outputs.state || 'timed-out' }}
          READBACK: ${{ steps.watch.outputs.readback }}
        run: |
          want=${{ needs.publish.outputs.generation }}
          if [ "$STATE" = "superseded" ]; then echo "revision $want was replaced by a newer revision that is live; that revision's run reports to the Sheet" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          gh api "repos/${{ github.repository }}/contents/inbox/result.json?ref=cms-inbox" > "$RUNNER_TEMP/cur.json" 2>/dev/null || echo "{}" > "$RUNNER_TEMP/cur.json"
          node cms/readback.mjs --record "$RUNNER_TEMP/cur.json" "$want" "$RUNNER_TEMP/live.json"
          if [ -f "$RUNNER_TEMP/live.json" ]; then
            sha=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).sha||'')}catch(e){console.log('')}" "$RUNNER_TEMP/cur.json")
            args=(-X PUT "repos/${{ github.repository }}/contents/inbox/result.json" -f message="Live check" -f branch=cms-inbox -f content="$(base64 -w0 "$RUNNER_TEMP/live.json")")
            [ -n "$sha" ] && args+=(-f sha="$sha")
            gh api "${args[@]}" --silent || echo "result not written (a newer result arrived meanwhile)"
            cat "$RUNNER_TEMP/live.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          [ "$STATE" = "live-verified" ] || { echo "::error::revision $want was not seen live within 10 minutes; GitHub Pages may still finish"; exit 1; }
